name: videos
on:
  schedule:
    # Shorts 4/gün: slotlar 13:00, 16:00, 20:00, 22:00 UTC (ET 09, 12, 16, 18 · TR 16, 19, 23, 01).
    # ET öğleden sonra/akşam 09-22..26 verisinde en iyisiydi; son slot 23:00 UTC'den önce ki
    # UTC günü (ve günlük sayaç) dönmeden iki deneme şansı olsun. cron-job.org saatlik tetikler.
    # Uzun video Salı/Perşembe/Cumartesi 17:00 UTC (TR 20:00).
    # GitHub cron'u geciktiriyor/düşürüyor: saatlik tetiklenir (yoğun :00 dışında),
    # .github/slot_guard.py sadece zamanı gelmiş ve yüklenmemiş slot varsa video yapar.
    - cron: "7 13-23 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: short or long
        type: choice
        options: [short, long]
        default: short
      no_upload:
        description: Render only, do not upload
        type: boolean
        default: false
      auto:
        description: External scheduler call - follow the slot plan like a scheduled run
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # yükleme sonrası comments.yml'yi tetiklemek için

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'schedule' || inputs.auto
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
      mode: ${{ steps.g.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
      - id: g
        env:
          LOG_FILE: published.csv
          SLOTS: "13:00,17:00,22:00"
          # uzun videolar medyan 156 izlenme (short 1175): haftada bire indirildi
          LONG: "sat 17:00 long"
        run: python3 .github/slot_guard.py

  make:
    needs: guard
    if: always() && ((github.event_name != 'schedule' && !inputs.auto) || needs.guard.outputs.go == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev pkg-config
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/stickstory
          key: kokoro-v1.0
      - name: Pick format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.auto }}" != "true" ]; then echo "f=${{ inputs.format }}" >> $GITHUB_OUTPUT
          else echo "f=${{ needs.guard.outputs.mode }}" >> $GITHUB_OUTPUT; fi
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          SCRIPT_SOURCE: ${{ vars.SCRIPT_SOURCE }}
        run: python run.py --format ${{ steps.fmt.outputs.f }} ${{ inputs.no_upload && '--no-upload' || '' }}
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_id }}
          path: |
            output/*/video.mp4
            output/*/script.json
            output/*/meta.json
            output/*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "stickstory-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in history.json published.csv queue; do [ -e "$p" ] && git add "$p" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
      - name: İlk yorum (hemen)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run comments.yml -R ${{ github.repository }} || true
